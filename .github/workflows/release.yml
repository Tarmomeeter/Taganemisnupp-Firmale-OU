name: Build plugin release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate version tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          plugin_version=$(sed -n 's/^ \* Version: //p' firmale-taganemisvorm.php | tr -d '\r')
          if [ "v${plugin_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version v${plugin_version}."
            exit 1
          fi

      - name: Build WordPress plugin ZIP
        shell: bash
        run: |
          mkdir -p build/firmale-taganemisvorm
          rsync -a ./ build/firmale-taganemisvorm/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'README.md'
          cd build
          zip -r firmale-taganemisvorm.zip firmale-taganemisvorm

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/firmale-taganemisvorm.zip --generate-notes --verify-tag

      - name: Store ZIP as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: firmale-taganemisvorm
          path: build/firmale-taganemisvorm.zip
